[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = m5stack-tab5-p4
framework = arduino
board_build.partitions = default_16MB.csv
extra_scripts =
    pre:scripts/toolchain_path.py
    pre:scripts/avatar_stack.py
    pre:scripts/sanotts_p4.py
monitor_speed = 115200
lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/stack-chan/m5stack-avatar.git#v0.10.0
    https://github.com/ayutaz/sanoTTS-jp/releases/download/v1.2.0/sanoTTS-jp-arduino.zip
    https://github.com/ayutaz/sanoTTS-jp/releases/download/v1.2.0/sanoTTS-jp-voice-tsukuyomi-v4.zip
build_flags =
    -Iinclude
    -DCORE_DEBUG_LEVEL=3
    ; Arduino 3.3.8 TAB5 variant omits this ESP32-P4 SPI core requirement.
    -DBOARD_SDMMC_POWER_CHANNEL=4
    -DSANOTTS_ENABLE_KANJI=0
    -DSANOTTS_ENABLE_PIE=0
    -DSAAN_P4_FAST=1
